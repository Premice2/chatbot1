<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculateur de déterminant</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1b2430;
    --muted: #5d6b7c;
    --line: #c9d2dd;
    --accent: #1f5fd1;
    --accent-text: #ffffff;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171d; --card: #1b222b; --text: #e8edf3; --muted: #9aa8b8;
      --line: #36424f; --accent: #6ea0ff; --accent-text: #0c1522; --error: #ff8a80;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171d; --card: #1b222b; --text: #e8edf3; --muted: #9aa8b8;
    --line: #36424f; --accent: #6ea0ff; --accent-text: #0c1522; --error: #ff8a80;
  }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  main {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px; width: 100%; max-width: 460px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  label { color: var(--muted); font-size: 0.95rem; }
  select, button, input {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
  }
  select { padding: 6px 10px; margin-left: 8px; }
  #grille { display: grid; gap: 8px; margin: 20px 0; overflow-x: auto; }
  #grille input { width: 100%; min-width: 0; padding: 10px 6px; text-align: center; box-sizing: border-box; }
  button {
    background: var(--accent); color: var(--accent-text); border: none;
    padding: 10px 18px; cursor: pointer; font-weight: 600;
  }
  button.secondaire { background: var(--bg); color: var(--text); border: 1px solid var(--line); margin-left: 8px; font-weight: 400; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #resultat { margin-top: 20px; font-size: 1.3rem; min-height: 1.6em; }
  #resultat.erreur { color: var(--error); font-size: 1rem; }
</style>
</head>
<body>
<main>
  <h1>Calculateur de déterminant</h1>

  <label for="taille">Taille de la matrice :
    <select id="taille">
      <option value="2">2 × 2</option>
      <option value="3" selected>3 × 3</option>
      <option value="4">4 × 4</option>
      <option value="5">5 × 5</option>
    </select>
  </label>

  <div id="grille"></div>

  <button id="calculer">Calculer</button>
  <button id="vider" class="secondaire">Effacer</button>

  <div id="resultat" aria-live="polite"></div>
</main>

<script>
  // --- 1. La fonction qui calcule le déterminant (récursive) ---
  function determinant(m) {
    if (m.length === 1) return m[0][0];  // Cas de base : matrice 1x1
    if (m.length === 2) return m[0][0] * m[1][1] - m[0][1] * m[1][0];  // Cas de base : matrice 2x2

    // Cas général : développement par rapport à la première ligne
    let det = 0;
    for (let col = 0; col < m.length; col++) {
      // On enlève la première ligne et la colonne "col"
      let sousMatrice = m.slice(1).map(ligne => 
        ligne.filter((_, index) => index !== col) 
      );
      let signe = col % 2 === 0 ? 1 : -1;
      det += signe * m[0][col] * determinant(sousMatrice);
    }
    return det;
  }

  // --- 2. Construire la grille de cases ---
  const grille = document.getElementById("grille");
  const resultat = document.getElementById("resultat");

  function construireGrille() {
    let n = parseInt(document.getElementById("taille").value);
    grille.style.gridTemplateColumns = `repeat(${n}, minmax(48px, 1fr))`;
    grille.innerHTML = "";
    for (let i = 0; i < n * n; i++) {
      let champ = document.createElement("input");
      champ.type = "number";
      champ.step = "any";
      champ.value = 0;
      champ.setAttribute("aria-label", `Ligne ${Math.floor(i / n) + 1}, colonne ${(i % n) + 1}`);
      grille.appendChild(champ);
    }
    resultat.textContent = "";
  }

  // --- 3. Lire les cases et calculer ---
  function calculer() {
    let n = parseInt(document.getElementById("taille").value);
    let champs = grille.querySelectorAll("input");
    let matrice = [];

    for (let i = 0; i < n; i++) {
      let ligne = [];
      for (let j = 0; j < n; j++) {
        let valeur = champs[i * n + j].value;
        if (valeur === "") {
          resultat.className = "erreur";
          resultat.textContent = `Remplis toutes les cases (il manque la ligne ${i + 1}, colonne ${j + 1}).`;
          return;
        }
        ligne.push(parseFloat(valeur));
      }
      matrice.push(ligne);
    }

    resultat.className = "";
    // Arrondi pour éviter les erreurs du type 0.30000000000000004
    let det = Math.round(determinant(matrice) * 1e9) / 1e9;
    resultat.textContent = `Déterminant = ${det}`;
  }

  // --- 4. Brancher les boutons ---
  document.getElementById("taille").addEventListener("change", construireGrille);
  document.getElementById("calculer").addEventListener("click", calculer);
  document.getElementById("vider").addEventListener("click", construireGrille);

  construireGrille();
</script>
</body>
</html>
