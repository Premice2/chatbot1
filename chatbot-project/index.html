<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
    <style>
            body {
        font-family: Arial, sans-serif;
        margin-top: 0px;
        margin-bottom: 0;
      }
      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        border:none;
        padding: 12px 20px;
        margin-left:10px;
        font-size: 15px;
        border-radius: 10px;
        cursor: pointer;
      }
      .chat-input {
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 12px 15px;
        font-size: 15px;
        flex-grow: 1; /*to take up available space*/
      }
      .chat-input-container {
        display: flex;
        margin-bottom: 60px;
      }
      .app-container{
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;

        height:100vh; /*to make the container take up the full height of the viewport*/
        display: flex;
        flex-direction: column; /*to make the container take up the full height of the viewport*/
      }
      .chat-message-user {
        display: flex;
        justify-content: end;
        align-items: start
      }
      .chat-message-robot {
        display: flex;        
        justify-content: start;
        align-items: start
      }
      .chat-message-text {
        background-color: #f1f1f1;
        border-radius: 10px;
        padding: 10px;
        margin: 10px;
        max-width: 300px;
        font-family: Arial, sans-serif;
      }
      .chat-messages-container {
        flex-grow: 1; /*to take up available space*/
        overflow-y: auto; /*to make the container scrollable*/ 
        /*padding: 10px;*/
        margin-top: 20px;
        scrollbar-width: none; /*to make the scrollbar disappear*/
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
